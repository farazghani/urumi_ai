services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - store_network

  wordpress:
    build:
      context: ./wordpress
    image: woo-wordpress:local
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - store_network

  mcp:
    build:
      context: ./mcp
    image: woo-mcp:local
    restart: unless-stopped

    depends_on:
      wordpress:
        condition: service_started

    env_file:
      - ./mcp/.env
    environment:
      # Containers reach WordPress by service name, not the host's localhost port.
      WOO_BASE_URL: http://wordpress
      WOO_FORWARDED_PROTO: https
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"

    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"

    networks:
      - store_network

volumes:
  db_data:
  wordpress_data:

networks:
  store_network:
    driver: bridge

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Docker DNS resolves a recreated backend without restarting this container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /frontend-health { access_log off; return 200 'ok'; }
        location = /health { include /etc/nginx/proxy.conf; }
        location /api/ { include /etc/nginx/proxy.conf; }
        location = /mcp { include /etc/nginx/proxy.conf; }
        location = /mcp/ { include /etc/nginx/proxy.conf; }
        location /static/ {
            alias /usr/share/nginx/html/;
            expires -1;
        }
        location = / { expires -1; try_files /index.html =404; }
        location / { return 404; }
    }
}

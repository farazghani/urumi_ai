apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urumi.name" . }}-frontend
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
data:
  nginx.conf: |
    {{- tpl (.Files.Get "files/nginx.conf") . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urumi.name" . }}-wordpress
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
data:
  config-extra: |
    define('WP_HOME', '{{ include "urumi.storeUrl" . }}');
    define('WP_SITEURL', '{{ include "urumi.storeUrl" . }}');
    define('DISALLOW_FILE_EDIT', true);
  health.php: |
    {{- .Files.Get "files/health.php" | nindent 4 }}
  health-apache.conf: |
    Alias "/urumi-health.php" "/opt/urumi/health.php"
    <Directory "/opt/urumi">
        Require all granted
    </Directory>
  bootstrap.sh: |
    {{- .Files.Get "files/bootstrap.sh" | nindent 4 }}
  bootstrap.php: |
    {{- .Files.Get "files/bootstrap.php" | nindent 4 }}

{{- $name := include "urumi.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-wordpress
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: wordpress
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wordpress
          image: {{ include "urumi.image" .Values.images.wordpress | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{name: http, containerPort: 80}]
          env:
            {{- include "urumi.wordpressEnv" . | nindent 12 }}
          resources: {{ toYaml .Values.wordpress.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /urumi-health.php, port: http}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet: {path: /urumi-health.php, port: http}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet: {path: "/urumi-health.php?check=ready", port: http}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          volumeMounts:
            - {name: data, mountPath: /var/www/html}
            - {name: config, mountPath: /opt/urumi, readOnly: true}
            - {name: config, mountPath: /etc/apache2/conf-enabled/urumi-health.conf, subPath: health-apache.conf, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.wordpress.storage.existingClaim | default (printf "%s-wordpress-data" $name) }}
        - name: config
          configMap: {name: {{ $name }}-wordpress}

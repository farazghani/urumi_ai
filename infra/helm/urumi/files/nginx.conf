worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    {{- range .Values.frontend.trustedProxyCidrs }}
    set_real_ip_from {{ . }};
    {{- end }}
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Service ClusterIP stays stable when backend pods are replaced.
    upstream gateway { server {{ include "urumi.name" . }}-backend:8001; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /frontend-health { access_log off; return 200 'ok'; }
        location ~ ^/(api/|mcp/?$|health$) {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Fixed by the trusted deployment configuration, never a client header.
            proxy_set_header X-Forwarded-Proto {{ ternary "https" "http" .Values.ingress.tls.enabled }};
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
        }
        location /static/ { alias /usr/share/nginx/html/; expires -1; }
        location = / { expires -1; try_files /index.html =404; }
        location / { return 404; }
    }
}

apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: urumi
servers: 1
agents: 0
ports:
  - port: 127.0.0.1:80:80
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:443:443
    nodeFilters: [loadbalancer]
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
